<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f3f5;
            font-family: 'Arial', sans-serif;
        }

        .container {
            max-width: 500px;
            margin-top: 50px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            background-color: #ffffff;
        }

        .card-header {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #007bff;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            width: 100%;
        }

        .form-control {
            border-radius: 10px;
            font-size: 16px;
        }

        .form-group label {
            font-size: 14px;
        }

        .btn-block {
            border-radius: 25px;
        }

        .text-center {
            color: #6c757d;
        }

        .alert {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="card-header">
                Sign Up
            </div>
            <form id="signupForm">
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                    <small id="passwordHelp" class="form-text text-muted">Make sure both passwords match.</small>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                    <label for="role">Sign up as:</label>
                    <select class="form-control" id="role" required>
                        <option value="customer">Customer</option>
                        <option value="vendor">Vendor</option>
                    </select>
                </div>

                <!-- Error Message -->
                <div class="alert alert-danger" id="errorMessage" role="alert">
                    Passwords do not match. Please try again.
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
            </form>
            <p class="text-center mt-3">Already have an account? 
                <a href="login.html">Login here</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function (event) {
            event.preventDefault();

            // Get form values
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const role = document.getElementById("role").value;

            // Validate if passwords match
            if (password !== confirmPassword) {
                // Show error message if passwords don't match
                document.getElementById("errorMessage").style.display = "block";
                return;
            }

            // Hide error message if passwords match
            document.getElementById("errorMessage").style.display = "none";

            
            localStorage.setItem("user", JSON.stringify({ username, password, role }));

            alert("Sign Up Successful! Please proceed to Login.");

            
            if (role === "vendor") {
                window.location.href = "vendorLogin.html";  
            } else {
                window.location.href = "login.html";  
            }
        });
    </script>

</body>

</html>
