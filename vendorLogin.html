<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f3f5;
            font-family: 'Arial', sans-serif;
        }

        .container {
            max-width: 500px;
            margin-top: 50px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            background-color: #ffffff;
        }

        .card-header {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #007bff;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            width: 100%;
        }

        .form-control {
            border-radius: 10px;
            font-size: 16px;
        }

        .form-group label {
            font-size: 14px;
        }

        .btn-block {
            border-radius: 25px;
        }

        .text-center {
            color: #6c757d;
        }

        .alert {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="card-header">
                Login
            </div>
            <form id="loginForm">
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>

                <!-- Error Message -->
                <div class="alert alert-danger" id="errorMessage" role="alert">
                    Invalid Username or Password. Please try again.
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <p class="text-center mt-3">Don't have an account? <a href="signup.html">Sign Up here</a></p>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            // Get form values
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Get user data from localStorage
            const userData = JSON.parse(localStorage.getItem("user"));

            // Check if the username and password match the stored data
            if (userData && userData.username === username && userData.password === password) {
                // Redirect based on user role
                if (userData.role === "customer") {
                    window.location.href = "mainpage.html";  // Redirect to customer page
                } else if (userData.role === "vendor") {
                    window.location.href = "vendor-dashboard.html";  // Redirect to vendor page
                }
            } else {
                // Show error message if login fails
                document.getElementById("errorMessage").style.display = "block";
            }
        });
    </script>

</body>

</html>
