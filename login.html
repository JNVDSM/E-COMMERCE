<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Coza Store - Login</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <!-- Font Awesome for improved icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <!-- Animate.css for fade-in animation -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        />
        <!-- jQuery and SweetAlert -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert/dist/sweetalert.min.js"></script>
    </head>
    <body
        class="d-flex align-items-center justify-content-center vh-100 bg-gradient bg-light"
    >
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div
                        class="card shadow-lg border-0 p-4 bg-white animate__animated animate__fadeIn"
                    >
                        <div class="text-center mb-3">
                            <i
                                class="fas fa-user-circle text-primary"
                                style="font-size: 60px"
                            ></i>
                        </div>
                        <h4 class="text-center mb-3 text-dark fw-semibold">
                            Coza Store
                        </h4>
                        <h6 class="text-center mb-4 text-secondary">
                            Welcome Back!
                        </h6>
                        <form id="loginForm">
                            <div class="form-floating mb-3">
                                <input
                                    type="email"
                                    class="form-control rounded-3"
                                    id="email"
                                    name="email"
                                    placeholder="name@example.com"
                                    required
                                />
                                <label for="email" class="text-muted"
                                    >Email address</label
                                >
                            </div>
                            <div class="form-floating mb-3">
                                <input
                                    type="password"
                                    class="form-control rounded-3"
                                    id="password"
                                    name="pass"
                                    placeholder="Password"
                                    required
                                />
                                <label for="password" class="text-muted"
                                    >Password</label
                                >
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <a
                                    href="#"
                                    class="text-decoration-none text-primary"
                                    >Forgot password?</a
                                >
                                <a
                                    href="/signup.html"
                                    class="text-decoration-none text-primary"
                                    >Sign Up</a
                                >
                            </div>
                            <div class="d-grid">
                                <button
                                    type="submit"
                                    class="btn btn-dark btn-lg rounded-3 shadow-sm"
                                >
                                    Login
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script>
            $(document).ready(function () {
                $("#loginForm").submit(function (e) {
                    e.preventDefault();
                    swal({
                        title: "Login Successful!",
                        text: "Redirecting to Coza Store...",
                        icon: "success",
                        button: false,
                        timer: 2000,
                    });
                    setTimeout(function () {
                        window.location.href = "/index.html";
                    }, 2200);
                });
            });
        </script>
    </body>
</html>
